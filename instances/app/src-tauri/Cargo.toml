[package]
name = "arxhub"
version = "0.1.0"
description = "Modular personal knowledge base"
authors = ["rougsig"]
license = "AGPL-3.0-or-later"
edition = "2021"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name — they collide on Windows.
# https://github.com/rust-lang/cargo/issues/8519
name = "arxhub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-os = "2"

