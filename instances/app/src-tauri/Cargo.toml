[package]
name = "arxhub"
version = "0.5.0"
description = "Modular personal knowledge base"
authors = ["rougsig"]
license = "AGPL-3.0-or-later"
edition = "2021"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name — they collide on Windows.
# https://github.com/rust-lang/cargo/issues/8519
name = "arxhub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-os = "2"

[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-geolocation = "2"

# The camera that reads a pairing invitation's QR. Phones only: a desktop has the in-page scanner (or
# the typed code), and the plugin has no desktop implementation to link.
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "2"
