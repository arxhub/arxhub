# Transitive build-time dependencies pinned forward past published advisories. None of these ship in
# a built artifact — they are the toolchain (bundler, type generation, glob matching) — but the dev
# stand runs on them, so they are worth keeping current. Each is the first patched version per the
# advisory; drop an entry once the parent depends on a fixed range by itself.
overrides:
  ajv: ^8.20.0
  brace-expansion: ^5.0.8
  esbuild: ^0.28.1
  file-type: ^21.3.4
  lodash: ^4.18.1
  minimatch: ^10.2.5
  picomatch: ^4.0.5
  postcss: ^8.5.23
  rollup: ^4.62.2
  srvx: ^0.12.4
