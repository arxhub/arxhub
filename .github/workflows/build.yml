name: Build

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PNPM_VERSION: 10.33.0
  NODE_VERSION: 22

jobs:
  version-check:
    name: One version number
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The root package.json is what every instance and the Tauri bundle read; Cargo.toml cannot read
      # it and is held equal by hand, so this is what makes a drift visible instead of silent (FR-211).
      - name: Cargo.toml matches the root package.json
        run: |
          node -e '
            const fs = require("fs")
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8")).version
            const cargo = fs.readFileSync("instances/app/src-tauri/Cargo.toml", "utf8").match(/^version = "([^"]+)"/m)?.[1]
            if (cargo !== pkg) {
              console.error(`instances/app/src-tauri/Cargo.toml says ${cargo}, package.json says ${pkg} — one number, keep them equal`)
              process.exit(1)
            }
            console.log(`version ${pkg}`)
          '

  client-check:
    name: Check browser client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @arxhub/client build

  app-build:
    name: Build desktop frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/set-version
      - run: pnpm --filter app build

  server-build:
    name: Build server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @arxhub/server build

  server-image:
    name: Validate server image
    runs-on: ubuntu-latest
    needs: server-build
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: instances/server/Dockerfile
          push: false
          tags: arxhub-server:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  linux-flatpak:
    name: Build Linux Flatpak
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri and Flatpak dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf flatpak flatpak-builder
          flatpak --user remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak --user install --noninteractive flathub org.gnome.Platform//48 org.gnome.Sdk//48
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/set-version
      - run: pnpm --filter app exec tauri build --bundles appimage
      - name: Prepare Flatpak payload
        run: |
          mkdir -p flatpak/payload
          cp instances/app/src-tauri/target/release/arxhub flatpak/payload/arxhub
          cp instances/app/src-tauri/icons/icon.png flatpak/payload/org.arxhub.ArxHub.png
          cp flatpak/org.arxhub.ArxHub.desktop flatpak/payload/org.arxhub.ArxHub.desktop
      - run: flatpak-builder --force-clean --repo=flatpak/repo flatpak/build flatpak/org.arxhub.ArxHub.yml
      - run: flatpak build-bundle flatpak/repo ArxHub.flatpak org.arxhub.ArxHub
      - uses: actions/upload-artifact@v4
        with:
          name: arxhub-linux-flatpak
          path: ArxHub.flatpak

  macos-dmg:
    name: Build macOS DMG
    strategy:
      matrix:
        include:
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/set-version
      - run: pnpm --filter app exec tauri build --target ${{ matrix.target }} --bundles dmg
      - uses: actions/upload-artifact@v4
        with:
          name: arxhub-macos-${{ matrix.target }}
          path: instances/app/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg

  windows-nsis:
    name: Build Windows installer (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/set-version
      - run: pnpm --filter app exec tauri build --target x86_64-pc-windows-msvc --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: arxhub-windows-x86_64
          path: instances/app/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error

  android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          # The action's default is `tools platform-tools`; Google stopped serving the legacy `tools`
          # package on 2026-09-15 (android-actions/setup-android#537), so the default fails inside the
          # action before our own sdkmanager line below ever runs.
          packages: platform-tools
      - run: sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/set-version
      - name: Configure Android signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          : "${KEYSTORE_BASE64:?Missing ANDROID_KEYSTORE_BASE64}"
          : "${KEYSTORE_PASSWORD:?Missing ANDROID_KEYSTORE_PASSWORD}"
          cd instances/app/src-tauri/gen/android
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > arxhub-release.jks
          {
            printf '%s\n' 'storeFile=../arxhub-release.jks'
            printf '%s\n' 'keyAlias=arxhub-release'
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyPassword=%s\n' "$KEYSTORE_PASSWORD"
          } > keystore.properties
      - run: pnpm --filter app exec tauri android build --apk
      - name: Verify APK signatures
        shell: bash
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          apks=(instances/app/src-tauri/gen/android/app/build/outputs/apk/**/*.apk)
          test "${#apks[@]}" -gt 0
          for apk in "${apks[@]}"; do
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$apk"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: arxhub-android-apk
          path: instances/app/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [version-check, client-check, app-build, server-build, server-image, linux-flatpak, macos-dmg, windows-nsis, android-apk]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: arxhub-*
          path: release-assets
          merge-multiple: true
      - name: Remove previous release assets
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const release = await github.rest.repos.getReleaseByTag({ owner: context.repo.owner, repo: context.repo.repo, tag: context.ref.replace('refs/tags/', '') })
              for (const asset of release.data.assets) {
                await github.rest.repos.deleteReleaseAsset({ owner: context.repo.owner, repo: context.repo.repo, asset_id: asset.id })
              }
            } catch (error) {
              if (error.status !== 404) throw error
            }
      - name: Rename release assets
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          short="${COMMIT_SHA:0:7}"
          find release-assets -type f -print0 | while IFS= read -r -d '' file; do
            mkdir -p release-assets/renamed
            case "$file" in
              *.dmg) suffix="${file##*/}"; suffix="${suffix##*_}"; target="release-assets/renamed/ArxHub_${RELEASE_VERSION}-${short}_${suffix}"; mv "$file" "$target" ;;
              *.flatpak) mv "$file" "release-assets/renamed/ArxHub_${RELEASE_VERSION}-${short}.flatpak" ;;
              *.exe) mv "$file" "release-assets/renamed/ArxHub_${RELEASE_VERSION}-${short}_x64-setup.exe" ;;
              *.apk) mv "$file" "release-assets/renamed/ArxHub_${RELEASE_VERSION}-${short}.apk" ;;
            esac
          done
          find release-assets -mindepth 1 -maxdepth 1 -type d ! -name renamed -exec rm -rf {} +
          rm -rf release-assets/old
          shopt -s dotglob
          mv release-assets/renamed/* release-assets/
          rmdir release-assets/renamed
      - uses: softprops/action-gh-release@v2
        with:
          name: ArxHub ${{ github.ref_name }}
          generate_release_notes: true
          files: release-assets/**
